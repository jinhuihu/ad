name: Android CI - 编译 APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v3
      
    - name: 设置 JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle
        
    - name: 授予 gradlew 执行权限
      run: |
        cd AndroidCaptchaSolver
        chmod +x gradlew
        
    - name: 清理项目
      run: |
        cd AndroidCaptchaSolver
        ./gradlew clean
        
    - name: 编译 Debug APK
      run: |
        cd AndroidCaptchaSolver
        ./gradlew assembleDebug --stacktrace
        
    - name: 编译 Release APK
      run: |
        cd AndroidCaptchaSolver
        ./gradlew assembleRelease --stacktrace
      continue-on-error: true  # Release 版本可能需要签名，允许失败
        
    - name: 查找 APK 文件
      run: |
        echo "查找生成的 APK 文件："
        find AndroidCaptchaSolver -name "*.apk" -type f
        
    - name: 上传 Debug APK
      uses: actions/upload-artifact@v3
      with:
        name: app-debug
        path: AndroidCaptchaSolver/app/build/outputs/apk/debug/app-debug.apk
        
    - name: 上传 Release APK（如果存在）
      uses: actions/upload-artifact@v3
      with:
        name: app-release
        path: AndroidCaptchaSolver/app/build/outputs/apk/release/app-release-unsigned.apk
      continue-on-error: true
      
    - name: 生成编译信息
      run: |
        echo "## 编译完成 ✅" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### APK 文件信息" >> $GITHUB_STEP_SUMMARY
        if [ -f "AndroidCaptchaSolver/app/build/outputs/apk/debug/app-debug.apk" ]; then
          SIZE=$(ls -lh AndroidCaptchaSolver/app/build/outputs/apk/debug/app-debug.apk | awk '{print $5}')
          echo "- Debug APK: ✅ ($SIZE)" >> $GITHUB_STEP_SUMMARY
        else
          echo "- Debug APK: ❌" >> $GITHUB_STEP_SUMMARY
        fi
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 下载方式" >> $GITHUB_STEP_SUMMARY
        echo "在 Actions 页面的 Artifacts 部分下载编译好的 APK" >> $GITHUB_STEP_SUMMARY


